<!DOCTYPE html>

<head>

        body { font-family: -apple-system, sans-serif; line-height: 1.6; padding: 20px; max-width: 800px; margin: auto; }
        h1 { color: #1E88E5; }
    </style>
</head>
<body>
    <h1>Impressum</h1>
    <p>Angaben gemäß § 5 TMG:</p>
    
    <p>
        <strong>Anbieter:</strong><br>
        name<br>
        adresse<br>
        postleitzahl<br>
        land

    <p>
        <strong>Kontakt:</strong><br>
        E-Mail: email
    </p>

    <p><strong>Verantwortlich für den Inhalt nach § 55 Abs. 2 RStV:</strong><br>
    name, adresse</p>
